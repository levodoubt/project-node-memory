name: publish

# Releases are cut by pushing a tag:  git tag v1.0.1 && git push origin v1.0.1
# The workflow then
#   1. runs the offline self-check,
#   2. refuses to publish when the tag and package.json disagree,
#   3. publishes to npm over OIDC (no long-lived token), with provenance,
#   4. attaches the packed tarball to a GitHub release (the marketplace entry
#      points its `tarball:` at exactly that asset).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: self-check (offline, no DSH needed)
        run: node scripts/check.mjs

      - name: tag must match package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            if (process.env.GITHUB_REF_TYPE !== "tag") {
              console.error("run this workflow from a version tag");
              process.exit(1);
            }
            if (pkg.version !== tag) {
              console.error(`tag v${tag} does not match package.json ${pkg.version}`);
              process.exit(1);
            }
            console.log(`publishing ${pkg.name}@${pkg.version}`);
          '

      - name: publish to npm (OIDC, provenance automatic)
        run: npm publish --access public

      - name: pack and attach the tarball to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="project-node-memory-${VERSION}.tgz"
          npm pack --pack-destination .
          gh release create "${GITHUB_REF_NAME}" "${TARBALL}" \
            --verify-tag \
            --title "project-node-memory ${VERSION}" \
            --notes "npm: https://www.npmjs.com/package/project-node-memory/v/${VERSION}"
